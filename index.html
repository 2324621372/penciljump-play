html,body{margin:0;height:100%;background:#fbf7ec;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block}

.language-card h2{font-size:24px;margin:0 0 10px}.language-card p{margin:0 0 18px}
.language-options{display:grid;gap:12px}.language-card button{min-height:48px;border:2px solid #8e8876;border-radius:6px;background:#fffdf5;padding:8px 14px}
.language-card button[aria-pressed="true"]{border:3px solid #2a55b8;background:#d9edff}
.language-close{margin-top:18px;width:100%;background:#bfe8ff!important}
button:focus-visible{outline:3px solid #2a55b8;outline-offset:3px}
